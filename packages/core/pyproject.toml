[project]
name = "mp-core"
version = "0.1.0"
description = "Market Pulse core: models, providers, analytics. All numbers come from here."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "httpx>=0.27",
    "tzdata>=2024.2",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "anthropic>=1.0",
    "defusedxml>=0.7",
]

[project.scripts]
mp = "mp_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mp_core"]
