# weekends are never trading days anyway.
#
# Source: NSE "Trading holidays for the calendar year" circulars (2026: dated 12 Dec 2025,
# 15 weekday holidays), cross-checked against broker-published copies because this
# machine's network blocks nseindia.com. Re-check against the circular when it is reachable.
# A year is listed in `complete_years` only when every holiday of that year is here;
# for any other year the calendar treats every weekday as a trading day and
# `calendar.holidays_known(year)` returns False.
#
# Not modelled: Muhurat trading (a short evening session on Diwali Laxmi Pujan, a holiday
# here: 2025-10-21, 2026-11-08 is a Sunday) and ad-hoc closures announced at short notice
# (e.g. election days) - add those as they are notified.

