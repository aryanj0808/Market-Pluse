# Index registry. Everything here changes over time at NSE's discretion, so it is
# data, not code. `verified = false` means: confirm against a real NSE F&O bhavcopy
# (the UDiFF file carries the lot size in NewBrdLotQty) before trusting it for P&L.

[NIFTY]
exchange = "NSE"
name = "Nifty 50"
strike_step = 50
lot_size = 65
weekly_expiry = "TUE"       # weekday of weekly expiry, or "" for none
monthly_expiry = "LAST_TUE"
verified = false

[BANKNIFTY]
exchange = "NSE"
name = "Nifty Bank"
strike_step = 100
lot_size = 30
weekly_expiry = ""          # NSE discontinued BankNifty weeklies (Nov 2024)
monthly_expiry = "LAST_TUE"
verified = false

[FINNIFTY]
exchange = "NSE"
name = "Nifty Financial Services"
strike_step = 50
lot_size = 60
weekly_expiry = ""
monthly_expiry = "LAST_TUE"
verified = false

# News relevance of index-wide tags (0..1). A constituent-specific story is weighted by that
# constituent's index weight instead (HDFC Bank news counts ~0.29 for BANKNIFTY, Yes Bank 0.005).
[NIFTY.news_tags]
MACRO_INDIA = 1.0
RBI_POLICY = 0.8
FLOWS = 0.8
GLOBAL = 0.6
SECTOR_BANKS = 0.35
SECTOR_FINANCIALS = 0.35

[BANKNIFTY.news_tags]
SECTOR_BANKS = 1.0
RBI_POLICY = 1.0
MACRO_INDIA = 0.6
FLOWS = 0.6
SECTOR_FINANCIALS = 0.5
GLOBAL = 0.4

[FINNIFTY.news_tags]
SECTOR_FINANCIALS = 1.0
SECTOR_BANKS = 0.75
RBI_POLICY = 1.0
MACRO_INDIA = 0.6
FLOWS = 0.6
GLOBAL = 0.4

